[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haui-rag-assistant"
version = "1.1.0"
description = "Trợ lý AI tra cứu quy chế HaUI"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "google-genai",
    "psycopg2-binary",
    "pgvector",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "streamlit",
    "requests",
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
